name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck library
        run: npm run check-types

      - name: Typecheck examples (proves the public types reject misuse)
        run: npm run check-types:examples

      - name: Build (ESM + CJS + d.ts)
        run: npm run build
